# Container variant of nginx.conf. Identical except that it proxies to the
# "app" compose service by name instead of 127.0.0.1 -- inside the nginx
# container, localhost is the container itself. Keep the two in sync.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
