name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/my-expenses
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python -c "import app; app.init_db()"
            # Ensure SECRET_KEY exists (generated once, persists across deploys)
            if [ ! -f /etc/my-expenses.env ]; then
              echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" \
                | sudo tee /etc/my-expenses.env > /dev/null
              sudo chmod 600 /etc/my-expenses.env
            fi
            # Keep the systemd unit in sync with the repo (picks up EnvironmentFile)
            sudo cp deploy/gunicorn.service /etc/systemd/system/gunicorn.service
            sudo systemctl daemon-reload
            sudo systemctl restart gunicorn
